<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F0E8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>History — Daily Life</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Header ─────────────────────────────────── */
    .header {
      padding: 52px 0 20px;
    }
    .header-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.1;
      margin-bottom: 4px;
    }
    .header-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* ── Calendar card ─────────────────────────── */
    .cal-card {
      padding: 18px;
      margin-bottom: 16px;
    }

    /* ── Day detail card ───────────────────────── */
    .detail-card {
      padding: 20px;
      margin-bottom: 14px;
    }
    .detail-date-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--cream-300);
    }
    .detail-day-name {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text);
    }
    .detail-day-full {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* Category section */
    .cat-section {
      margin-bottom: 18px;
    }
    .cat-section:last-child {
      margin-bottom: 0;
    }
    .cat-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .cat-icon {
      width: 26px; height: 26px;
      border-radius: 8px;
      background: var(--cream-300);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-mid);
      flex-shrink: 0;
    }
    .cat-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex: 1;
    }
    .cat-total {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* Expense rows */
    .exp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--cream-300);
      font-size: 0.875rem;
    }
    .exp-row:last-child { border-bottom: none; }
    .exp-desc { color: var(--text); }
    .exp-amount {
      font-weight: 600;
      color: var(--espresso-500);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* Inspiration rows */
    .inspo-item {
      padding: 10px 12px;
      background: var(--cream-200);
      border-radius: var(--r-sm);
      font-size: 0.875rem;
      color: var(--text-mid);
      font-style: italic;
      line-height: 1.5;
      margin-bottom: 6px;
      border-left: 2px solid var(--accent-light);
    }
    .inspo-item:last-child { margin-bottom: 0; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-faint);
      font-size: 0.85rem;
    }
    .empty-icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    /* No data for date */
    .no-data {
      font-size: 0.82rem;
      color: var(--text-faint);
      text-align: center;
      padding: 8px 0;
    }

    /* ── Expense total row ──────────────────────── */
    .exp-list .exp-row:last-child { border-bottom: 1px solid var(--cream-300); }
    .exp-total-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 2px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
    .exp-grand-total {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    /* ── Monthly summary block ──────────────────── */
    .monthly-summary {
      background: var(--cream-200);
      border: 1px solid var(--cream-400);
      border-radius: var(--r-md);
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .monthly-summary-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .monthly-stats {
      display: flex;
      align-items: center;
      gap: 0;
    }
    .monthly-stat {
      flex: 1;
      text-align: center;
    }
    .monthly-stat-val {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      margin-bottom: 2px;
    }
    .monthly-stat-key {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .monthly-stat-divider {
      width: 1px;
      height: 32px;
      background: var(--cream-400);
      flex-shrink: 0;
    }

    /* ── 1st of month marker in calendar ─────────── */
    .cal-day.first-of-month:not(.selected):not(.today) {
      font-weight: 700;
      color: var(--accent);
    }
    /* ── Trash button ──────────────────────────────── */
    .del-btn {
      flex-shrink: 0;
      margin-left: auto;
      width: 26px; height: 26px;
      border: none;
      background: transparent;
      color: var(--espresso-200);
      cursor: pointer;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: var(--transition);
      opacity: 0;
    }
    .exp-row:hover .del-btn,
    .task-row:hover .del-btn,
    .inspo-item:hover .del-btn { opacity: 1; }
    .del-btn:hover { background: #FEE2E2; color: #dc2626; }

    .inspo-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .inspo-item span { flex: 1; }
    .del-btn-inspo { margin-top: 1px; }
  </style>
</head>
<body>

<div class="toast" id="toast" role="alert" aria-live="polite"></div>

<main class="page">

  <!-- Header -->
  <header class="header fade-up">
    <h1 class="header-title">History</h1>
    <p class="header-sub" id="histSubtitle">Select a date to view records.</p>
  </header>

  <!-- Calendar -->
  <section class="card cal-card fade-up">
    <div class="cal-header">
      <button class="cal-nav-btn" id="prevMonth" aria-label="Previous month">&#8249;</button>
      <span class="cal-month-label" id="calMonthLabel">May 2026</span>
      <button class="cal-nav-btn" id="nextMonth" aria-label="Next month">&#8250;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <!-- Day detail (hidden until date selected) -->
  <section class="card detail-card fade-up" id="detailCard" style="display:none;">
    <div class="detail-date-header">
      <div>
        <div class="detail-day-name" id="detailDayName">—</div>
        <div class="detail-day-full" id="detailDayFull">—</div>
      </div>
    </div>

    <div id="detailContent">
      <!-- Rendered by JS -->
    </div>
  </section>

</main>

<!-- Bottom Nav -->
<nav class="bottom-nav" aria-label="Main navigation">
  <a href="index.html" class="nav-item">
    <div class="nav-icon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    Home
  </a>
  <a href="history.html" class="nav-item active" aria-current="page">
    <div class="nav-icon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    History
  </a>
</nav>

<script src="history.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW:', e));
    });
  }
</script>
</body>
</html>
