<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F5F0E8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Daily Life</title>
  <meta name="description" content="Track your daily expenses, tasks, and inspirations." />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ── Header ─────────────────────────────────── */
    .header {
      padding: 52px 0 20px;
    }
    .header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .header-title {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.1;
    }
    .header-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
      letter-spacing: 0.02em;
    }
    .spend-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .spend-total {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }
    .spend-label-sm {
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Quick input section ─────────────────────── */
    .quick-inputs {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }
    .input-group-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-icon {
      width: 36px;
      height: 36px;
      border-radius: var(--r-sm);
      background: var(--cream-300);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--text-mid);
    }
    .amount-input {
      width: 80px;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      text-align: right;
    }
    .desc-input {
      flex: 1;
    }

    /* ── Calendar Card ─────────────────────────── */
    .cal-card {
      padding: 18px;
      margin-bottom: 14px;
    }

    /* ── Day panel ─────────────────────────────── */
    .day-panel {
      padding: 18px 18px 14px;
      margin-bottom: 14px;
    }
    .day-panel-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .day-label {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text);
    }
    .day-sublabel {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .task-empty {
      font-size: 0.82rem;
      color: var(--text-faint);
      padding: 10px 0 4px;
      text-align: center;
    }
    .add-task-row {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--cream-300);
    }

    /* ── Quick day strip ───────────────────────── */
    .quick-days {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .quick-days::-webkit-scrollbar { display: none; }

    .quick-day-btn {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 12px;
      border-radius: var(--r-md);
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      transition: var(--transition);
      font-family: var(--font);
    }
    .quick-day-btn .qd-dow {
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .quick-day-btn .qd-num {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
    }
    .quick-day-btn:hover { border-color: var(--caramel-300); }
    .quick-day-btn.is-today .qd-num { color: var(--accent); }
    .quick-day-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    .quick-day-btn.active .qd-dow,
    .quick-day-btn.active .qd-num { color: var(--cream-100); }
  </style>
</head>
<body>

<div class="toast" id="toast" role="alert" aria-live="polite"></div>

<main class="page">

  <!-- Header -->
  <header class="header fade-up">
    <div class="header-top">
      <div>
        <h1 class="header-title">Daily Life</h1>
        <p class="header-date" id="headerDate">Loading…</p>
      </div>
      <div class="spend-badge">
        <span class="spend-label-sm">Today</span>
        <span class="spend-total" id="spendTotal">NT$ —</span>
      </div>
    </div>
  </header>

  <!-- Quick Inputs -->
  <section class="quick-inputs fade-up">

    <!-- Expense -->
    <div>
      <div class="input-group-label">Expense</div>
      <div class="input-row">
        <div class="input-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <input id="expAmount" class="input amount-input" type="number" inputmode="numeric"
          placeholder="0" aria-label="Amount" min="0" />
        <input id="expDesc" class="input desc-input" type="text"
          placeholder="Description" aria-label="Description" maxlength="80" />
        <button class="btn-icon btn" onclick="addExpense()" aria-label="Add expense">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Inspiration -->
    <div>
      <div class="input-group-label">Inspiration</div>
      <div class="input-row">
        <div class="input-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a7 7 0 0 1 7 7c0 3.5-2.5 5.5-3 8H8c-.5-2.5-3-4.5-3-8a7 7 0 0 1 7-7z"/>
            <path d="M9 21h6"/><path d="M9.5 17.5h5"/>
          </svg>
        </div>
        <input id="inspoInput" class="input desc-input" type="text"
          placeholder="Write your inspiration…" aria-label="Inspiration" maxlength="200" />
        <button class="btn-icon btn" onclick="addInspiration()" aria-label="Add inspiration">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

  </section>

  <!-- Mini Calendar -->
  <section class="card cal-card fade-up">
    <div class="cal-header">
      <button class="cal-nav-btn" id="prevMonth" aria-label="Previous month">&#8249;</button>
      <span class="cal-month-label" id="calMonthLabel">May 2026</span>
      <button class="cal-nav-btn" id="nextMonth" aria-label="Next month">&#8250;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <!-- Quick day strip -->
  <div class="quick-days" id="quickDays"></div>

  <!-- Day tasks panel -->
  <section class="card day-panel fade-up">
    <div class="day-panel-header">
      <div>
        <div class="day-label" id="dayPanelLabel">Today</div>
        <div class="day-sublabel" id="dayPanelSub"></div>
      </div>
      <span style="font-size:0.68rem;color:var(--text-faint);" id="taskCount"></span>
    </div>
    <div id="taskList"></div>
    <div class="add-task-row">
      <input id="taskInput" class="input" type="text"
        placeholder="Add task for this day…" aria-label="New task" maxlength="200" />
      <button class="btn-icon btn" onclick="addTask()" aria-label="Add task">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
  </section>

</main>

<!-- Bottom Nav -->
<nav class="bottom-nav" aria-label="Main navigation">
  <a href="index.html" class="nav-item active" aria-current="page">
    <div class="nav-icon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    Home
  </a>
  <a href="history.html" class="nav-item">
    <div class="nav-icon">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </div>
    History
  </a>
</nav>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(e => console.warn('SW:', e));
    });
  }
</script>
</body>
</html>
